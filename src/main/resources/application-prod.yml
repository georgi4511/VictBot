# Spring Config
spring:
  datasource:
    url: jdbc:h2:file:./assets/database
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

# Swagger Config
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Custom Config
vict:
  twitter:
    fix: true
  discord:
    token: ${BOT_TOKEN}
#    guilds: ${BOT_GUILDS}
  # Procedure Scheduling
  procedure:
    logging:
      cron: "0 0 * * * ?"
    reminder:
      cron: "0 * * * * ?"